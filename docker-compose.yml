# Local development / CI stack for the ZenFlow backend.
#
#   docker compose up --build            # API on http://localhost:8000 + worker + beat
#   docker compose --profile test run --rm test   # run the full Django test suite
#   docker compose --profile tools run --rm manage createsuperuser
#
# Copy backend/.env.example to backend/.env first; the values below only
# override what is needed for the containers to talk to each other.

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgres://zenflow:zenflow@db:5432/zenflow
    CELERY_BROKER_URL: redis://redis:6379/0
    ALLOWED_HOSTS: localhost,127.0.0.1,api
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  volumes:
    - ./backend:/app
    - backend-static:/app/staticfiles
    - backend-media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenflow
      POSTGRES_USER: zenflow
      POSTGRES_PASSWORD: zenflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenflow -d zenflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

  # One-shot: full backend test suite against a throwaway Postgres database.
  test:
    <<: *backend
    command: python manage.py test --noinput
    profiles: ["test"]
    environment:
      DATABASE_URL: postgres://zenflow:zenflow@db:5432/zenflow
      CELERY_TASK_ALWAYS_EAGER: "true"
      DEBUG: "false"
      SECRET_KEY: test-secret-key-not-for-production

  # One-shot: `docker compose --profile tools run --rm manage <command>`
  manage:
    <<: *backend
    entrypoint: ["python", "manage.py"]
    profiles: ["tools"]

volumes:
  postgres-data:
  backend-static:
  backend-media:
